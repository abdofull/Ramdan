<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>المسبحة الذكية - رفيق الختمة</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&family=Reem+Kufi:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { tajawal: ['Tajawal', 'sans-serif'], amiri: ['Amiri', 'serif'], reem: ['Reem Kufi', 'sans-serif'] },
                    colors: {
                        gold: { DEFAULT: '#d4af37', light: '#e8c860', dark: '#b8941e' },
                        midnight: { DEFAULT: '#0f172a', light: '#1e293b', lighter: '#334155' }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --color-gold: #d4af37;
            --color-midnight: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--color-midnight);
            color: white;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .font-amiri {
            font-family: 'Amiri', serif;
        }

        .font-reem {
            font-family: 'Reem Kufi', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 30% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }

            25% {
                transform: translateY(-30px) translateX(15px);
                opacity: 0.5;
            }

            50% {
                transform: translateY(-50px) translateX(20px);
                opacity: 0.6;
            }

            75% {
                transform: translateY(-20px) translateX(-10px);
                opacity: 0.4;
            }
        }

        /* تقدم دائري */
        .progress-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(var(--color-gold) 0deg, rgba(255, 255, 255, 0.05) 0deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            transition: background 0.3s ease;
        }

        .count-number {
            font-size: 4rem;
            font-weight: bold;
            font-family: 'Reem Kufi', sans-serif;
            line-height: 1;
        }

        .count-label {
            font-size: 1.2rem;
            color: var(--color-gold);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.2s;
            cursor: pointer;
        }

        .option-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--color-gold);
        }

        .option-btn.active {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--color-gold);
        }

        .juz-progress {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .juz-progress-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #d4af37, #e8c860);
            transition: width 0.5s ease;
        }

        .back-link {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            color: var(--color-gold);
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .back-link:hover {
            background: var(--color-gold);
            color: black;
        }
    </style>
</head>

<body>

    <!-- خلفية متحركة -->
    <div class="particles" id="particles"></div>

    <!-- رابط العودة للتطبيق الرئيسي (نفترض أن الصفحة الرئيسية هي index.html) -->
    <a href="index.html" class="back-link"><i class="fas fa-arrow-right ml-1"></i>العودة للتطبيق</a>

    <!-- بطاقة المسبحة -->
    <div class="glass-card rounded-2xl w-full max-w-md p-6 relative z-10 scale-in">
        <div class="text-center mb-4">
            <i class="fas fa-praying-hands text-gold text-3xl"></i>
            <h1 class="font-reem text-2xl font-bold text-gold mt-2">المسبحة الذكية</h1>
        </div>

        <!-- العداد الدائري -->
        <div class="progress-circle" id="progress-circle">
            <span class="count-number" id="count-display">0</span>
            <span class="count-label" id="label-display">سبحان الله</span>
        </div>

        <!-- اختيار الذكر -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <div class="option-btn p-3 rounded-xl text-center" data-type="0" id="option-subhan">
                <i class="fas fa-star text-gold mb-1"></i>
                <div class="text-sm">سبحان الله</div>
                <div class="text-xs text-gold" id="subhan-count">0</div>
            </div>
            <div class="option-btn p-3 rounded-xl text-center" data-type="1" id="option-hamd">
                <i class="fas fa-heart text-gold mb-1"></i>
                <div class="text-sm">الحمد لله</div>
                <div class="text-xs text-gold" id="hamd-count">0</div>
            </div>
            <div class="option-btn p-3 rounded-xl text-center" data-type="2" id="option-allah">
                <i class="fas fa-arrow-up text-gold mb-1"></i>
                <div class="text-sm">الله أكبر</div>
                <div class="text-xs text-gold" id="allah-count">0</div>
            </div>
        </div>

        <!-- تحديد الهدف -->
        <div class="mb-6">
            <label class="block text-sm text-gray-400 mb-2 text-right">الهدف</label>
            <div class="flex gap-2">
                <button onclick="setGoal(33)" class="option-btn flex-1 py-2 rounded-lg text-sm" id="goal-33">٣٣</button>
                <button onclick="setGoal(66)" class="option-btn flex-1 py-2 rounded-lg text-sm" id="goal-66">٦٦</button>
                <button onclick="setGoal(99)" class="option-btn flex-1 py-2 rounded-lg text-sm" id="goal-99">٩٩</button>
                <button onclick="setGoal(0)" class="option-btn flex-1 py-2 rounded-lg text-sm" id="goal-0">بدون</button>
            </div>
        </div>

        <!-- شريط التقدم -->
        <div class="mb-6">
            <div class="flex justify-between text-xs text-gray-400 mb-1">
                <span>التقدم</span>
                <span id="progress-text">0/33</span>
            </div>
            <div class="juz-progress">
                <div class="juz-progress-fill" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- أزرار التحكم -->
        <div class="flex gap-3">
            <button onclick="increment()"
                class="flex-1 bg-gold hover:bg-gold-light text-black py-4 rounded-xl font-bold text-xl transition-all shadow-lg shadow-yellow-500/20 pulse-glow">
                <i class="fas fa-plus ml-2"></i>زيادة
            </button>
            <button onclick="resetCurrent()"
                class="flex-1 bg-white/10 hover:bg-white/20 py-4 rounded-xl font-bold transition-colors">
                <i class="fas fa-undo-alt ml-2"></i>إعادة
            </button>
        </div>
        <button onclick="resetAll()"
            class="w-full mt-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 py-3 rounded-xl font-bold transition-colors">
            <i class="fas fa-trash-alt ml-2"></i>إعادة ضبط الكل
        </button>

        <!-- توقيع -->
        <p class="text-center text-[10px] text-gray-500 mt-6">رفيق الختمة - سبحان الله وبحمده</p>
    </div>

    <script>
        // أسماء الأذكار
        const DHIKR_NAMES = ['سبحان الله', 'الحمد لله', 'الله أكبر'];

        // الحالة (تخزن في localStorage)
        let state = {
            counts: [0, 0, 0],        // سبحان الله, الحمد لله, الله أكبر
            currentType: 0,            // 0,1,2
            goal: 33                   // الهدف (0 يعني بدون هدف)
        };

        // تحميل من localStorage
        function loadState() {
            try {
                const saved = localStorage.getItem('tasbih_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) { }
        }

        // حفظ في localStorage
        function saveState() {
            try {
                localStorage.setItem('tasbih_state', JSON.stringify(state));
            } catch (e) { }
        }

        // تحديث واجهة المستخدم
        function updateUI() {
            // تحديث العدادات الصغيرة تحت الأزرار
            document.getElementById('subhan-count').textContent = toArabicNum(state.counts[0]);
            document.getElementById('hamd-count').textContent = toArabicNum(state.counts[1]);
            document.getElementById('allah-count').textContent = toArabicNum(state.counts[2]);

            // تحديث العداد الكبير والليبل
            document.getElementById('count-display').textContent = toArabicNum(state.counts[state.currentType]);
            document.getElementById('label-display').textContent = DHIKR_NAMES[state.currentType];

            // تحديث الدائرة (conic-gradient)
            const circle = document.getElementById('progress-circle');
            const percent = state.goal > 0 ? Math.min(100, (state.counts[state.currentType] / state.goal) * 100) : 0;
            const angle = (percent / 100) * 360;
            circle.style.background = `conic-gradient(var(--color-gold) ${angle}deg, rgba(255,255,255,0.05) ${angle}deg)`;

            // تحديث شريط التقدم
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').textContent = state.goal > 0
                ? `${toArabicNum(state.counts[state.currentType])}/${toArabicNum(state.goal)}`
                : toArabicNum(state.counts[state.currentType]);

            // تمييز الذكر النشط
            document.querySelectorAll('.option-btn[data-type]').forEach(el => {
                const type = parseInt(el.dataset.type);
                if (type === state.currentType) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // تمييز الهدف النشط
            document.getElementById('goal-33').classList.remove('active');
            document.getElementById('goal-66').classList.remove('active');
            document.getElementById('goal-99').classList.remove('active');
            document.getElementById('goal-0').classList.remove('active');
            if (state.goal === 33) document.getElementById('goal-33').classList.add('active');
            else if (state.goal === 66) document.getElementById('goal-66').classList.add('active');
            else if (state.goal === 99) document.getElementById('goal-99').classList.add('active');
            else if (state.goal === 0) document.getElementById('goal-0').classList.add('active');
        }

        // تحويل الأرقام إلى عربية
        function toArabicNum(num) {
            const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).replace(/\d/g, d => arabicDigits[d]);
        }

        // تبديل الذكر
        function switchTasbih(type) {
            state.currentType = type;
            saveState();
            updateUI();
        }

        // زيادة العداد الحالي
        function increment() {
            state.counts[state.currentType]++;
            if (state.goal > 0 && state.counts[state.currentType] >= state.goal) {
                // تهليل عند الوصول للهدف (اختياري)
                if (state.counts[state.currentType] === state.goal) {
                    // يمكن إضافة صوت أو رسالة
                }
            }
            saveState();
            updateUI();
        }

        // إعادة تعيين العداد الحالي
        function resetCurrent() {
            state.counts[state.currentType] = 0;
            saveState();
            updateUI();
        }

        // إعادة ضبط الكل
        function resetAll() {
            if (confirm('هل أنت متأكد من إعادة ضبط جميع العدادات؟')) {
                state.counts = [0, 0, 0];
                state.currentType = 0;
                state.goal = 33;
                saveState();
                updateUI();
            }
        }

        // تعيين الهدف
        function setGoal(goal) {
            state.goal = goal;
            saveState();
            updateUI();
        }

        // تهيئة الجسيمات
        function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 5 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = (Math.random() * 100) + 'vw';
                p.style.top = (Math.random() * 100) + 'vh';
                p.style.animationDuration = (Math.random() * 20 + 10) + 's';
                p.style.animationDelay = '-' + (Math.random() * 20) + 's';
                container.appendChild(p);
            }
        }

        // الربط بين الأزرار والدوال
        document.addEventListener('DOMContentLoaded', () => {
            initParticles();
            loadState();
            updateUI();

            // ربط أزرار الأذكار
            document.getElementById('option-subhan').addEventListener('click', () => switchTasbih(0));
            document.getElementById('option-hamd').addEventListener('click', () => switchTasbih(1));
            document.getElementById('option-allah').addEventListener('click', () => switchTasbih(2));
        });
    </script>
</body>

</html>
